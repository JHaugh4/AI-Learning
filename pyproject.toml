[project]
name = "ai-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian Luther", email = "briansluther@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "tiktoken>=0.13.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[project.scripts]
ai-learning = "ai_learning:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

# --- PyTorch wheel routing -------------------------------------------------
# macOS gets the default ("cpu") wheel, which ships MPS/Metal GPU support.
# Linux/Windows get a CUDA build for NVIDIA GPUs. The "cpu" label means
# "no CUDA", not "no GPU" — on macOS that wheel is GPU-accelerated via MPS.
# To change the CUDA version, edit the pytorch-cuda url (e.g. cu128) + re-lock.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cuda", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
